services:
  devopsdb:
    image: aruna1105/devops:db-img
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  application:
    image: aruna1105/devops:app-img
    ports:
      - "1111:8080"
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
